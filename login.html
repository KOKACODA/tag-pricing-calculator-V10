<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · KOKALabel 报价系统</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=9.7.2">
<link rel="icon" type="image/png" href="assets/favicon.png?v=9.7.2">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 60%,#3b82f6 100%); }
  .card { background:#fff; width:400px; border-radius:16px; padding:38px 36px 30px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .logo { text-align:center; }
  .logo .t { font-size:26px; font-weight:800; color:#1e3a8a; letter-spacing:1px; }
  .logo .s { font-size:13px; color:#64748b; margin-top:6px; }
  .field { margin-top:20px; }
  .field label { display:block; font-size:13px; color:#475569; margin-bottom:6px; font-weight:600; }
  .field input { width:100%; padding:12px 14px; border:2px solid #cbd5e1; border-radius:10px; font-size:15px; outline:none; transition:.2s; }
  .field input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.15); }
  .btn { width:100%; margin-top:24px; padding:13px; font-size:16px; font-weight:700; color:#fff; background:#2563eb; border:none; border-radius:10px; cursor:pointer; transition:.2s; }
  .btn:hover { background:#1d4ed8; }
  .btn:disabled { background:#93c5fd; cursor:not-allowed; }
  .msg { margin-top:16px; font-size:14px; text-align:center; min-height:20px; }
  .msg.err { color:#dc2626; } .msg.ok { color:#059669; font-weight:700; }
  .tip { margin-top:18px; text-align:center; font-size:12px; color:#94a3b8; line-height:1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="t">KOKALabel</div>
    <div class="s">吊牌报价系统 · 账号登录</div>
  </div>
  <div class="field"><label>账号</label><input id="username" autocomplete="username" placeholder="请输入账号"></div>
  <div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码"></div>
  <div class="field" id="setupField" style="display:none;"><label>初始化密钥 <span style="font-weight:400;color:#94a3b8;">（仅系统首次初始化时填写）</span></label><input id="setupKey" type="password" autocomplete="off" placeholder="首次初始化密钥"></div>
  <button class="btn" id="loginBtn">登 录</button>
  <div class="msg" id="msg"></div>
  <div class="tip">本系统为授权使用，账号由管理员分配<br>使用期限 / 停用请联系管理员</div>
</div>
<script src="js/login.js?v=9.7.2"></script>
</body>
</html>
